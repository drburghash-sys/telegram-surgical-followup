name: Deploy Surgical Follow-up to Cloudflare

# Run manually while the bot is being connected and tested.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surgical-followup-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Cloudflare account ID (not a secret); taken from the account's dashboard URL.
      CLOUDFLARE_ACCOUNT_ID: "2babc0b2627ad400dec78a01e34cf72c"
      # Store this token ONLY in GitHub Settings > Secrets and variables > Actions.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Verify Cloudflare API token is configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN to the repository's Actions secrets first."
            exit 1
          fi

      - name: Create or update D1 tables
        run: npx wrangler d1 migrations apply surgical_followup --remote

      - name: Deploy Cloudflare Worker and Mini App
        run: npx wrangler deploy

      - name: Next steps
        run: |
          echo "Worker deployed. Next configure Worker secrets in Cloudflare:"
          echo "TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, ADMIN_TELEGRAM_ID"
          echo "Then register Telegram webhook and menu button using scripts/setup-bot.mjs."
