name: Deploy Surgical Follow-up to Cloudflare

# Deploy from main on changes, or on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surgical-followup-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Cloudflare account ID (not a secret); taken from the account's dashboard URL.
      CLOUDFLARE_ACCOUNT_ID: "2babc0b2627ad400dec78a01e34cf72c"
      # Store this token ONLY in GitHub Settings > Secrets and variables > Actions.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Verify Cloudflare API token is configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN to the repository's Actions secrets first."
            exit 1
          fi

      - name: Create or update D1 tables
        run: npx wrangler d1 migrations apply surgical_followup --remote

      - name: Deploy Cloudflare Worker and Mini App
        run: npx wrangler deploy

      - name: Activate @burghashbot after administrator secrets are saved
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
          WORKER_URL: "https://surgical-followup-demo.drburghash.workers.dev"
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$ADMIN_TELEGRAM_ID" ]; then
            echo "Deployment complete; bot activation is pending."
            echo "Add TELEGRAM_BOT_TOKEN and ADMIN_TELEGRAM_ID under Settings > Secrets and variables > Actions."
            exit 0
          fi
          if ! [[ "$ADMIN_TELEGRAM_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::ADMIN_TELEGRAM_ID must be a numeric Telegram user ID."
            exit 1
          fi
          node --input-type=module -e '
            const res=await fetch("https://api.telegram.org/bot"+process.env.TELEGRAM_BOT_TOKEN+"/getMe");
            const data=await res.json();
            if (!data.ok || data.result?.username?.toLowerCase()!=="burghashbot") {
              console.error("::error::The Telegram token does not belong to @burghashbot.");
              process.exit(1);
            }
            console.log("Verified bot username: @burghashbot");
          '
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$ADMIN_TELEGRAM_ID" | npx wrangler secret put ADMIN_TELEGRAM_ID
          TELEGRAM_WEBHOOK_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")"
          printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET
          export TELEGRAM_WEBHOOK_SECRET
          npm run setup:telegram
          echo "Bot webhook and administrator menu configured successfully."

      - name: Next steps
        run: |
          echo "Cloudflare Worker deployed and D1 migrated."
          echo "Telegram activation automatically occurs once both bot secrets are present."
